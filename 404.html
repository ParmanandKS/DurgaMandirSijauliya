<!DOCTYPE html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <title>माँ सिद्धेश्वरी दुर्गा मंदिर, सिजौलिया</title>
    <script>
      // Single Page App redirect for GitHub Pages
      const path = window.location.pathname;
      const repo = '/DurgaMandirSijauliya/';
      if (path.startsWith(repo)) {
        window.location.replace(repo);
      } else {
        window.location.replace('/DurgaMandirSijauliya/');
      }
    </script>
  </head>
  <body>
    <p>Redirecting to माँ सिद्धेश्वरी दुर्गा मंदिर, सिजौलिया...</p>
  </body>
</html>
